[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "partinfo"
version = "0.1.0"
description = "Electronic component reference database with ASCII pinout diagrams"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
partinfo = "partinfo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/partinfo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
