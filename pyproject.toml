[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "partinfo"
version = "0.1.4"
description = "Electronic component reference database with ASCII pinout diagrams"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "hed0rah", email = "18272116+hed0rah@users.noreply.github.com"},
]
keywords = ["electronics", "cli", "reference", "datasheet", "pinout", "offline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/hed0rah/partinfo"
Repository = "https://github.com/hed0rah/partinfo"
Issues = "https://github.com/hed0rah/partinfo/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff", "build"]

[project.scripts]
partinfo = "partinfo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/partinfo"]

[tool.hatch.build.targets.wheel.force-include]
"skills/partinfo/SKILL.md" = "partinfo/_skill/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
